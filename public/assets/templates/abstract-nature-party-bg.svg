      <path d="M 0,8 L 55,-20" stroke="#8E2B45" stroke-width="2" stroke-linecap="round"/>
      <path d="M -16,10 C -16,0 16,0 16,10 Z" class="flower-deep"/>
      <circle cx="0" cy="5" r="4" fill="#FAF3E8"/>
    </g>
    <g id="side-bud">
