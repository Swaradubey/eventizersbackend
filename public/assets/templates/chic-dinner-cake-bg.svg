<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Sparkle Symbol -->
    <g id="sparkle-black">
      <path d="M 0,-8 Q 0.5,-1 8,0 Q 0.5,1 0,8 Q -0.5,1 -8,0 Q -0.5,-1 0,-8 Z" fill="#222222"/>
    </g>
    <g id="sparkle-sm">
      <path d="M 0,-5 Q 0.3,-0.5 5,0 Q 0.3,0.5 0,5 Q -0.3,0.5 -5,0 Q -0.3,-0.5 0,-5 Z" fill="#222222"/>
    </g>
    <!-- Soft warm glow for candles -->
    <radialGradient id="candle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD580" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Background: Warm cream/beige (#F4EFE6) -->
  <rect width="500" height="700" fill="#F4EFE6"/>

  <!-- Subtle Double Hairline Frame with notched corners for editorial elegance -->
  <rect x="18" y="18" width="464" height="664" rx="4" fill="none" stroke="#222222" stroke-width="0.75" stroke-opacity="0.3"/>
  <rect x="23" y="23" width="454" height="654" rx="2" fill="none" stroke="#222222" stroke-width="0.35" stroke-opacity="0.2"/>

  <!-- Upper Ambient Sparkles & Confetti Stars in clean sketch line art -->
  <g transform="translate(60, 48)"><use href="#sparkle-sm" opacity="0.6"/></g>
  <g transform="translate(438, 56)"><use href="#sparkle-black" opacity="0.6"/></g>
  <g transform="translate(85, 130)"><use href="#sparkle-black" opacity="0.5"/></g>
  <g transform="translate(420, 140)"><use href="#sparkle-sm" opacity="0.5"/></g>
  <g transform="translate(48, 220)"><circle cx="0" cy="0" r="1.5" fill="#222222" opacity="0.4"/></g>
  <g transform="translate(452, 230)"><circle cx="0" cy="0" r="1.5" fill="#222222" opacity="0.4"/></g>

  <!-- ========================================================================= -->
  <!-- ILLUSTRATION LAYER: Hand-drawn minimalist black line sketch at bottom       -->
  <!-- Multi-tier cake, champagne glasses, candlesticks, wine bottle, sprigs     -->
  <!-- ========================================================================= -->
  <g id="illustration-group" stroke="#222222" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Table Horizon & Sketch Ground Line -->
    <path d="M 40,622 C 120,621 220,622 300,621 C 380,621 440,622 460,622" stroke-width="1.2" opacity="0.7"/>
    <path d="M 70,626 C 160,625 280,626 430,625" stroke-width="0.6" stroke-dasharray="8 6" opacity="0.4"/>

    <!-- ========================================== -->
    <!-- 1. LEFT: TALL CANDLESTICK & FLAME           -->
    <!-- ========================================== -->
    <g transform="translate(90, 470)">
      <!-- Candle Flame Glow -->
      <circle cx="0" cy="-48" r="14" fill="url(#candle-glow)"/>
      <!-- Flickering Flame -->
      <path d="M 0,-42 C -3,-48 -3,-54 0,-59 C 3,-54 3,-48 0,-42 Z" fill="#222222" stroke-width="1.2"/>
      <path d="M 0,-42 L 0,-36" stroke-width="1.2"/>
      <!-- Candle Body -->
      <path d="M -4.5,-36 L -4.5,70 L 4.5,70 L 4.5,-36 Z" stroke-width="1.4" fill="#F4EFE6"/>
      <!-- Wax Drips -->
      <path d="M -4.5,-20 C -2,-18 -3,-12 -4.5,-10" stroke-width="1"/>
      <path d="M 4.5,-16 C 3,-14 3.5,-8 4.5,-6" stroke-width="1"/>
      <!-- Candle Cup & Collar -->
      <path d="M -9,70 C -9,67 9,67 9,70 L 6,76 L -6,76 Z" stroke-width="1.4" fill="#F4EFE6"/>
      <!-- Candlestick Shaft -->
      <path d="M -3.5,76 L -3.5,115 L 3.5,115 L 3.5,76" stroke-width="1.4"/>
      <!-- Ornamental Knobs -->
      <ellipse cx="0" cy="95" rx="7" ry="3.5" stroke-width="1.3" fill="#F4EFE6"/>
      <ellipse cx="0" cy="115" rx="9" ry="4" stroke-width="1.4" fill="#F4EFE6"/>
      <!-- Base of Candlestick -->
      <path d="M -6,117 C -15,130 -22,142 -26,152 L 26,152 C 22,142 15,130 6,117 Z" stroke-width="1.5" fill="#F4EFE6"/>
      <ellipse cx="0" cy="152" rx="26" ry="6" stroke-width="1.5" fill="#F4EFE6"/>
    </g>

    <!-- Olive / Botanical Sprigs on Left -->
    <g transform="translate(112, 570)" opacity="0.85">
      <path d="M 0,50 Q -15,20 -5,-15 Q 5,-40 2,-65" stroke-width="1.2"/>
      <!-- Leaves -->
      <path d="M -3,35 C -12,32 -18,22 -12,18 C -7,22 -3,28 -3,35 Z" stroke-width="1" fill="#F4EFE6"/>
      <path d="M -1,15 C 8,10 14,3 10,-2 C 5,2 0,8 -1,15 Z" stroke-width="1" fill="#F4EFE6"/>
      <path d="M -4,-5 C -14,-7 -18,-16 -12,-20 C -7,-16 -3,-11 -4,-5 Z" stroke-width="1" fill="#F4EFE6"/>
      <path d="M 0,-25 C 8,-30 12,-38 7,-42 C 3,-38 -1,-32 0,-25 Z" stroke-width="1" fill="#F4EFE6"/>
      <path d="M 2,-55 C 2,-65 8,-72 3,-75 C -1,-70 0,-62 2,-55 Z" stroke-width="1" fill="#F4EFE6"/>
    </g>

    <!-- ========================================== -->
    <!-- 2. CENTER: MULTI-TIER BIRTHDAY CAKE         -->
    <!-- ========================================== -->
    <g transform="translate(250, 410)">

      <!-- Tier 1 (Top Tier) Candles -->
      <!-- Center Candle -->
      <circle cx="0" cy="-35" r="9" fill="url(#candle-glow)"/>
      <path d="M 0,-30 C -2,-35 -2,-39 0,-43 C 2,-39 2,-35 0,-30 Z" fill="#222222" stroke-width="1"/>
      <line x1="0" y1="-30" x2="0" y2="-24" stroke-width="1"/>
      <rect x="-2" y="-24" width="4" height="24" rx="1" stroke-width="1.2" fill="#F4EFE6"/>
      <line x1="-2" y1="-16" x2="2" y2="-18" stroke-width="0.8"/>
      <line x1="-2" y1="-8" x2="2" y2="-10" stroke-width="0.8"/>

      <!-- Left Candle -->
      <circle cx="-22" cy="-30" r="8" fill="url(#candle-glow)"/>
      <path d="M -22,-26 C -24,-30 -24,-34 -22,-37 C -20,-34 -20,-30 -22,-26 Z" fill="#222222" stroke-width="1"/>
      <line x1="-22" y1="-26" x2="-22" y2="-20" stroke-width="1"/>
      <rect x="-24" y="-20" width="4" height="20" rx="1" stroke-width="1.2" fill="#F4EFE6"/>
      <line x1="-24" y1="-13" x2="-20" y2="-15" stroke-width="0.8"/>

      <!-- Right Candle -->
      <circle cx="22" cy="-30" r="8" fill="url(#candle-glow)"/>
      <path d="M 22,-26 C 20,-30 20,-34 22,-37 C 24,-34 24,-30 22,-26 Z" fill="#222222" stroke-width="1"/>
      <line x1="22" y1="-26" x2="22" y2="-20" stroke-width="1"/>
      <rect x="20" y="-20" width="4" height="20" rx="1" stroke-width="1.2" fill="#F4EFE6"/>
      <line x1="20" y1="-13" x2="24" y2="-15" stroke-width="0.8"/>

      <!-- TOP TIER CAKE -->
      <!-- Top Surface -->
      <ellipse cx="0" cy="0" rx="42" ry="12" stroke-width="1.6" fill="#F4EFE6"/>
      <!-- Icing Swags on Top rim -->
      <path d="M -42,0 C -35,8 -25,8 -20,1 C -15,8 -5,8 0,1 C 5,8 15,8 20,1 C 25,8 35,8 42,0" stroke-width="1.2"/>
      <!-- Top Tier Cylinder Sides -->
      <line x1="-42" y1="0" x2="-42" y2="45" stroke-width="1.6"/>
      <line x1="42" y1="0" x2="42" y2="45" stroke-width="1.6"/>
      <!-- Top Tier Bottom Curvature -->
      <path d="M -42,45 C -42,58 42,58 42,45" stroke-width="1.6" fill="#F4EFE6"/>
      <!-- Delicate Piped Frosting Garland on Top Tier -->
      <path d="M -38,20 Q -20,32 0,22 Q 20,32 38,20" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M -36,32 Q -18,44 0,34 Q 18,44 36,32" stroke-width="1" stroke-dasharray="3 2"/>

      <!-- BOTTOM TIER CAKE -->
      <!-- Shelf / Intermediate Layer Trim -->
      <ellipse cx="0" cy="46" rx="72" ry="16" stroke-width="1.6" fill="#F4EFE6"/>
      <!-- Icing Pearl Drops around bottom tier top rim -->
      <path d="M -72,46 Q -55,57 -38,49 Q -20,58 0,51 Q 20,58 38,49 Q 55,57 72,46" stroke-width="1.3"/>
      <!-- Side Walls -->
      <line x1="-72" y1="46" x2="-72" y2="115" stroke-width="1.8"/>
      <line x1="72" y1="46" x2="72" y2="115" stroke-width="1.8"/>
      <!-- Bottom Curvature -->
      <path d="M -72,115 C -72,135 72,135 72,115" stroke-width="1.8" fill="#F4EFE6"/>
      <!-- Elegant Draped Swag Garlands on Main Cake Tier -->
      <path d="M -66,70 Q -44,88 -22,74 Q 0,90 22,74 Q 44,88 66,70" stroke-width="1.3"/>
      <path d="M -62,84 Q -42,102 -20,88 Q 0,104 20,88 Q 42,102 62,84" stroke-width="1" stroke-dasharray="4 2.5"/>
      <!-- Small Hanging Droplets / Pearl accents -->
      <circle cx="-33" cy="85" r="1.5" fill="#222222"/>
      <circle cx="0" cy="87" r="1.5" fill="#222222"/>
      <circle cx="33" cy="85" r="1.5" fill="#222222"/>
      <circle cx="-31" cy="99" r="1.3" fill="#222222"/>
      <circle cx="0" cy="101" r="1.3" fill="#222222"/>
      <circle cx="31" cy="99" r="1.3" fill="#222222"/>

      <!-- ========================================== -->
      <!-- PEDESTAL / SCALLOPED CAKE STAND            -->
      <!-- ========================================== -->
      <!-- Plate Rim & Scalloped Edge -->
      <ellipse cx="0" cy="116" rx="86" ry="18" stroke-width="1.8" fill="#F4EFE6"/>
      <path d="M -86,116 C -86,128 86,128 86,116 L 82,124 C 82,134 -82,134 -82,124 Z" stroke-width="1.5" fill="#F4EFE6"/>
      <!-- Decorative Scallops under plate rim -->
      <path d="M -80,124 Q -70,132 -60,125 Q -50,133 -40,126 Q -30,133 -20,126 Q -10,133 0,126 Q 10,133 20,126 Q 30,133 40,126 Q 50,133 60,125 Q 70,132 80,124" stroke-width="1.2"/>
      <!-- Pedestal Stem -->
      <path d="M -14,130 C -8,145 -12,175 -24,195 L 24,195 C 12,175 8,145 14,130 Z" stroke-width="1.6" fill="#F4EFE6"/>
      <!-- Pedestal Collar Ring -->
      <ellipse cx="0" cy="155" rx="13" ry="4" stroke-width="1.3" fill="#F4EFE6"/>
      <!-- Pedestal Foot / Base -->
      <path d="M -24,195 C -35,202 -48,206 -52,212 L 52,212 C 48,206 35,202 24,195 Z" stroke-width="1.6" fill="#F4EFE6"/>
      <ellipse cx="0" cy="212" rx="52" ry="12" stroke-width="1.8" fill="#F4EFE6"/>
    </g>

    <!-- ========================================== -->
    <!-- 3. RIGHT: CHAMPAGNE FLUTES & BOTTLE        -->
    <!-- ========================================== -->
    <!-- Champagne Bottle -->
    <g transform="translate(415, 455)">
      <!-- Bottle Punt / Base -->
      <ellipse cx="0" cy="165" rx="22" ry="7" stroke-width="1.5" fill="#F4EFE6"/>
      <!-- Body Walls -->
      <line x1="-22" y1="75" x2="-22" y2="165" stroke-width="1.5"/>
      <line x1="22" y1="75" x2="22" y2="165" stroke-width="1.5"/>
      <!-- Shoulder Curves -->
      <path d="M -22,75 C -22,40 -8,25 -8,0 L 8,0 C 8,25 22,40 22,75" stroke-width="1.5" fill="#F4EFE6"/>
      <!-- Neck & Lip -->
      <rect x="-7.5" y="-18" width="15" height="18" stroke-width="1.4" fill="#F4EFE6"/>
      <ellipse cx="0" cy="-18" rx="8.5" ry="3" stroke-width="1.4" fill="#F4EFE6"/>
      <ellipse cx="0" cy="-21" rx="7.5" ry="2.5" stroke-width="1.2" fill="#F4EFE6"/>
      <!-- Foil Neck Wrapper Details -->
      <line x1="-7.5" y1="-8" x2="7.5" y2="-8" stroke-width="1"/>
      <line x1="-8" y1="2" x2="8" y2="2" stroke-width="1"/>
      <!-- Bottle Label -->
      <rect x="-16" y="85" width="32" height="46" rx="2" stroke-width="1.2" fill="#F4EFE6"/>
      <rect x="-13" y="88" width="26" height="40" rx="1" stroke-width="0.6" stroke-dasharray="2 1.5"/>
      <line x1="-8" y1="98" x2="8" y2="98" stroke-width="1"/>
      <circle cx="0" cy="108" r="4" stroke-width="0.8"/>
      <line x1="-9" y1="118" x2="9" y2="118" stroke-width="0.8"/>
    </g>

    <!-- Clinking Champagne Flutes (Flute 1: tilted left) -->
    <g transform="translate(345, 520) rotate(-12)">
      <!-- Effervescence Bubbles -->
      <circle cx="-1" cy="-22" r="1.2" fill="#222222"/>
      <circle cx="2" cy="-14" r="1.5" fill="#222222"/>
      <circle cx="-3" cy="-5" r="1" fill="#222222"/>
      <circle cx="1" cy="5" r="1.4" fill="#222222"/>
      <!-- Flute Bowl -->
      <path d="M -9,-30 C -9,0 -6,18 0,26 C 6,18 9,0 9,-30 Z" stroke-width="1.4" fill="#F4EFE6"/>
      <ellipse cx="0" cy="-30" rx="9" ry="3" stroke-width="1.4" fill="#F4EFE6"/>
      <!-- Wine Fill Line -->
      <path d="M -7.5,-8 C -7.5,6 -4,15 0,22 C 4,15 7.5,6 7.5,-8 Z" stroke-width="0.8" opacity="0.6"/>
      <!-- Stem -->
      <line x1="0" y1="26" x2="0" y2="76" stroke-width="1.4"/>
      <!-- Foot / Base -->
      <ellipse cx="0" cy="76" rx="14" ry="4" stroke-width="1.4" fill="#F4EFE6"/>
    </g>

    <!-- Clinking Champagne Flutes (Flute 2: tilted right) -->
    <g transform="translate(372, 518) rotate(14)">
      <!-- Effervescence Bubbles -->
      <circle cx="1" cy="-20" r="1.2" fill="#222222"/>
      <circle cx="-2" cy="-12" r="1.5" fill="#222222"/>
      <circle cx="2" cy="-4" r="1" fill="#222222"/>
      <circle cx="-1" cy="6" r="1.4" fill="#222222"/>
      <!-- Flute Bowl -->
      <path d="M -9,-30 C -9,0 -6,18 0,26 C 6,18 9,0 9,-30 Z" stroke-width="1.4" fill="#F4EFE6"/>
      <ellipse cx="0" cy="-30" rx="9" ry="3" stroke-width="1.4" fill="#F4EFE6"/>
      <!-- Wine Fill Line -->
      <path d="M -7.5,-8 C -7.5,6 -4,15 0,22 C 4,15 7.5,6 7.5,-8 Z" stroke-width="0.8" opacity="0.6"/>
      <!-- Stem -->
      <line x1="0" y1="26" x2="0" y2="76" stroke-width="1.4"/>
      <!-- Foot / Base -->
      <ellipse cx="0" cy="76" rx="14" ry="4" stroke-width="1.4" fill="#F4EFE6"/>
    </g>

    <!-- Clinking Sparkle Burst between glasses -->
    <g transform="translate(358, 480)">
      <use href="#sparkle-black"/>
      <circle cx="-8" cy="-8" r="1" fill="#222222"/>
      <circle cx="8" cy="-6" r="1.2" fill="#222222"/>
      <circle cx="6" cy="8" r="0.8" fill="#222222"/>
    </g>

    <!-- Foliage / Flower Sprig on Right Base -->
    <g transform="translate(425, 615)" opacity="0.8">
      <path d="M 0,5 Q 15,-10 32,-15" stroke-width="1.2"/>
      <path d="M 12,-3 C 14,-10 20,-12 24,-8 C 22,-3 16,0 12,-3 Z" stroke-width="0.9" fill="#F4EFE6"/>
      <path d="M 22,-8 C 26,-15 34,-16 36,-11 C 33,-7 26,-5 22,-8 Z" stroke-width="0.9" fill="#F4EFE6"/>
    </g>

    <!-- Additional Ambient Sketch Details around Cake -->
    <g transform="translate(160, 410)"><use href="#sparkle-sm" opacity="0.6"/></g>
    <g transform="translate(340, 395)"><use href="#sparkle-sm" opacity="0.6"/></g>
    <g transform="translate(145, 490)"><circle cx="0" cy="0" r="1.2" fill="#222222" opacity="0.5"/></g>
    <g transform="translate(330, 445)"><circle cx="0" cy="0" r="1.2" fill="#222222" opacity="0.5"/></g>

  </g>
</svg>
