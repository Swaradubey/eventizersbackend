<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Soft Blush Pink Base Gradient -->
    <linearGradient id="blush-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4F6"/>
      <stop offset="35%" stop-color="#FAE8EC"/>
      <stop offset="70%" stop-color="#F5DCE2"/>
      <stop offset="100%" stop-color="#EED0D7"/>
    </linearGradient>

    <!-- Metallic Gold Foil Shimmer -->
    <linearGradient id="gold-foil" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2932E"/>
      <stop offset="20%" stop-color="#E5C158"/>
      <stop offset="40%" stop-color="#FFF2A1"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="90%" stop-color="#FDF4B8"/>
      <stop offset="100%" stop-color="#9A6B12"/>
    </linearGradient>

    <!-- Subtle Golden Shimmer Noise -->
    <filter id="gold-sparkle" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.72  0 0 0 0 0.35  0 0 0 0.22 0" in="noise" result="tintedNoise"/>
      <feComposite in="SourceGraphic" in2="tintedNoise" operator="over"/>
    </filter>

    <!-- Seamless Botanical Line Art Tile -->
    <pattern id="gold-floral-pattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="url(#gold-foil)" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
        <!-- Center Rose Motif -->
        <g transform="translate(100, 100)">
          <path d="M -4,-2 C -8,-10 0,-16 6,-12 C 12,-8 14,0 8,6 C 2,12 -8,12 -12,4" stroke-width="1.2"/>
          <path d="M 0,-18 C -14,-22 -20,-6 -14,10 C -8,22 10,24 20,12 C 28,0 22,-16 8,-20" stroke-width="1.1"/>
          <path d="M -22,-6 C -28,-18 -10,-32 10,-28 C 30,-24 38,-4 26,18 C 14,34 -12,32 -26,16" stroke-width="0.9"/>
          <!-- Surrounding Leaves -->
          <path d="M -16,14 C -30,22 -36,12 -38,4 C -34,16 -24,20 -12,18" stroke-width="0.95" fill="url(#gold-foil)" fill-opacity="0.12"/>
          <path d="M 18,12 C 32,20 38,10 40,2 C 36,14 26,18 14,16" stroke-width="0.95" fill="url(#gold-foil)" fill-opacity="0.12"/>
          <path d="M 4,-24 C 8,-36 -4,-42 -12,-40 C -4,-38 2,-32 2,-22" stroke-width="0.9" fill="url(#gold-foil)" fill-opacity="0.12"/>
        </g>
        <!-- Corner Roses for seamless tiling -->
        <g transform="translate(0, 0)">
          <circle cx="0" cy="0" r="8" stroke-width="1.1"/>
          <path d="M -10,-4 C -14,10 4,14 10,6" stroke-width="0.9"/>
          <path d="M 6,10 C 16,16 22,8 20,-2" stroke-width="0.85"/>
        </g>
        <g transform="translate(200, 0)">
          <circle cx="0" cy="0" r="8" stroke-width="1.1"/>
          <path d="M -10,-4 C -14,10 4,14 10,6" stroke-width="0.9"/>
        </g>
        <g transform="translate(0, 200)">
          <circle cx="0" cy="0" r="8" stroke-width="1.1"/>
          <path d="M -10,-4 C -14,10 4,14 10,6" stroke-width="0.9"/>
        </g>
        <g transform="translate(200, 200)">
          <circle cx="0" cy="0" r="8" stroke-width="1.1"/>
          <path d="M -10,-4 C -14,10 4,14 10,6" stroke-width="0.9"/>
        </g>
        <!-- Delicate sprigs / berries -->
        <circle cx="45" cy="55" r="2.5" fill="url(#gold-foil)" stroke="none"/>
        <circle cx="52" cy="46" r="2" fill="url(#gold-foil)" stroke="none"/>
        <circle cx="155" cy="45" r="2.5" fill="url(#gold-foil)" stroke="none"/>
        <circle cx="148" cy="56" r="2" fill="url(#gold-foil)" stroke="none"/>
        <circle cx="50" cy="155" r="2.2" fill="url(#gold-foil)" stroke="none"/>
        <circle cx="152" cy="150" r="2.2" fill="url(#gold-foil)" stroke="none"/>
      </g>
    </pattern>

    <!-- Pearlescent Shimmer Overlay -->
    <radialGradient id="pearl-sheen" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFF5F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F2D2DA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Blush Pink Satin Base -->
  <rect width="800" height="800" fill="url(#blush-base)"/>
  <!-- Gold Foil Floral Line Art -->
  <rect width="800" height="800" fill="url(#gold-floral-pattern)"/>
  <!-- Shimmer Highlights -->
  <rect width="800" height="800" fill="url(#pearl-sheen)"/>
</svg>
